# Minecraft terminology, Traditional Chinese (Taiwan).
#
# `source`  the English term as it is spoken
# `target`  the rendering used by the zh-TW Minecraft client
# `aliases` renderings a general-purpose LLM reaches for instead — usually the
#           mainland-Chinese name or a literal translation. These are rewritten
#           to `target` after translation, which catches the (common) case where
#           the model simply ignored the glossary in the prompt.
#
# Only add an alias you are sure is wrong in context. `aliases` are substring
# matches for CJK, so an alias that is also an ordinary word will over-fire.

terms:
  # --- the game itself --------------------------------------------------
  # Models reach for 我的世界, which is the mainland name. Taiwan keeps the
  # English title (麥塊 colloquially); the alias rewrite also fixes 《我的世界》
  # because CJK aliases match as plain substrings.
  - source: Minecraft
    target: Minecraft
    aliases: [我的世界]

  # --- dimensions and places -------------------------------------------
  - source: Nether
    target: 地獄
    aliases: [下界]
  - source: Nether portal
    target: 地獄傳送門
    aliases: [下界傳送門]
